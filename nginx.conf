server {
    listen 80;
    root /usr/share/nginx/html/app;
    index reader.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location = /manifest.json {
        add_header Content-Type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /icon.svg {
        try_files $uri =404;
    }

    location = /reader.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = / {
        return 301 /reader.html;
    }

    location /js/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location /css/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location /illustrations/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://web:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ollama Cloud proxy — ключ підставляється сервером (з env OLLAMA_KEY),
    # у браузер не потрапляє. Клієнт б'є на /ollama/v1/chat/completions без ключа.
    location /ollama/ {
        proxy_pass https://ollama.com/;
        proxy_set_header Host ollama.com;
        proxy_set_header Authorization "Bearer ${OLLAMA_KEY}";
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://web:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
